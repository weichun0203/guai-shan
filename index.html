<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桃園支聯會移車查詢</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // 文青配色系統
                        'heritage-blue': '#4a5d6a', // 導航欄深藍灰
                        'sage-green': '#6b9080',    // 按鈕草綠
                        'sage-dark': '#557266',     // 按鈕深綠
                        'paper-white': '#fdfbf7',   // 背景米白
                        'warm-gray': '#a4ac86',     // 裝飾色
                        'muted-coral': '#e29578',   // 重置按鈕
                    },
                    fontFamily: {
                        sans: ['"Microsoft JhengHei"', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            font-family: "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #fdfbf7; /* 米白紙質感 */
        }
        .modal { transition: opacity 0.25s ease; }
        body.modal-active { overflow-x: hidden; overflow-y: visible !important; }
        
        /* Toast 動畫 */
        #toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
        }
        .toast {
            transform: translateX(100%);
            transition: transform 0.3s ease-in-out;
        }
        .toast.show {
            transform: translateX(0);
        }

        /* Loading Overlay 動畫 */
        #loading-overlay {
            transition: opacity 0.5s ease-in-out;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #6b9080;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 車牌掃描畫面 */
        #scanGuide {
            position: absolute;
            left: 50%;
            top: 42%;
            width: 84%;
            max-width: 460px;
            aspect-ratio: 2.3 / 1;
            transform: translate(-50%, -50%);
            border: 3px solid rgba(255,255,255,0.9);
            border-radius: 12px;
            box-shadow: 0 0 0 9999px rgba(0,0,0,0.45);
            transition: border-color 0.2s;
        }
        #scanGuide.found { border-color: #6b9080; }
        #scanGuide::after {
            content: "";
            position: absolute;
            left: 6%;
            right: 6%;
            height: 2px;
            background: rgba(107,144,128,0.9);
            box-shadow: 0 0 8px rgba(107,144,128,0.9);
            animation: scanline 1.8s ease-in-out infinite;
        }
        @keyframes scanline {
            0%, 100% { top: 12%; }
            50% { top: 86%; }
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen pb-24 relative">

    <!-- Loading Overlay (同步畫面) -->
    <div id="loading-overlay" class="fixed inset-0 bg-paper-white z-[9999] flex flex-col items-center justify-center">
        <div class="loader mb-4"></div>
        <h2 id="loading-text" class="text-xl font-bold text-heritage-blue tracking-widest">正在連線 Google 資料庫...</h2>
        <p class="text-sm text-gray-500 mt-2">正在同步最新車輛資訊</p>
    </div>

    <!-- 導航欄 -->
    <nav class="bg-heritage-blue text-white shadow-md sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <!-- Icon: Database -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6 text-warm-gray"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
                    <span class="font-bold text-lg tracking-widest">車牌查詢系統</span>
                </div>
                <div class="flex items-center gap-4 text-sm opacity-90">
                    <span id="syncStatus" class="hidden sm:block bg-sage-green px-3 py-1 rounded-full text-xs font-medium tracking-wide">資料已同步</span>
                    <span id="totalCount" class="font-mono">總數: 0</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主要內容區 -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- 控制面板 -->
        <div class="flex flex-col md:flex-row gap-4 mb-8 justify-between items-start md:items-center">
            <!-- 搜尋框 -->
            <div class="relative w-full md:w-96 shadow-sm">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <!-- Icon: Search -->
                    <svg class="h-5 w-5 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                </div>
                <input type="text" id="searchInput" 
                    class="block w-full pl-10 pr-3 py-3 border border-gray-200 rounded-lg bg-white focus:ring-2 focus:ring-sage-green focus:border-sage-green outline-none transition text-gray-700"
                    placeholder="搜尋車牌、姓名或外觀...">
            </div>

            <!-- 按鈕區 -->
            <div class="flex flex-wrap md:flex-nowrap gap-2 w-full md:w-auto">
                <button onclick="openScanner()" title="用相機掃描車牌" class="basis-full md:basis-auto whitespace-nowrap flex items-center justify-center gap-2 bg-heritage-blue hover:opacity-90 text-white px-5 py-3 rounded-lg shadow-md transition font-medium tracking-wide">
                    <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                    掃描車牌
                </button>
                <button onclick="openModal()" class="flex-1 md:flex-none flex items-center justify-center gap-2 bg-sage-green hover:bg-sage-dark text-white px-6 py-3 rounded-lg shadow-md transition-colors font-medium tracking-wide">
                    <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    新增
                </button>
                <button onclick="shareLink()" title="分享連結" class="flex items-center justify-center gap-2 bg-white text-heritage-blue hover:bg-gray-50 border border-gray-200 px-4 py-3 rounded-lg shadow-sm transition-colors font-medium">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                </button>
                <button onclick="fetchDataFromGAS()" title="強制同步" class="flex items-center justify-center gap-2 bg-white text-heritage-blue hover:bg-gray-50 border border-gray-200 px-4 py-3 rounded-lg shadow-sm transition-colors font-medium">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"></path><path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path><path d="M3 22v-6h6"></path><path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path></svg>
                </button>
            </div>
        </div>

        <!-- 統計資訊 -->
        <div class="mb-6 border-b border-gray-200 pb-2 flex justify-between items-end">
            <h2 class="text-xl font-bold text-heritage-blue tracking-wide">查詢結果</h2>
            <span id="displayCount" class="text-sm text-gray-500">顯示 0 筆資料</span>
        </div>
        
        <div id="emptyMsg" class="hidden text-center py-12">
             <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gray-100 mb-4">
                <svg class="h-8 w-8 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
             </div>
             <p class="text-gray-500 font-medium">查無資料</p>
             <p class="text-sm text-gray-400 mt-1">請嘗試其他關鍵字</p>
        </div>

        <!-- 卡片容器 -->
        <div id="cardContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- JS 渲染內容 -->
        </div>

    </main>

    <!-- Modal (新增視窗) -->
    <div id="modal" class="modal fixed w-full h-full top-0 left-0 flex items-center justify-center opacity-0 pointer-events-none z-50">
        <div class="modal-overlay absolute w-full h-full bg-heritage-blue opacity-60 backdrop-blur-sm"></div>
        
        <div class="modal-container bg-white w-11/12 md:max-w-md mx-auto rounded-xl shadow-2xl z-50 overflow-y-auto transform transition-all scale-95 duration-300">
            
            <div class="bg-heritage-blue px-6 py-4 flex justify-between items-center text-white">
                <p class="font-bold text-lg flex items-center gap-2 tracking-wide">新增資料</p>
                <div onclick="closeModal()" class="cursor-pointer z-50 hover:bg-white/10 rounded p-1 transition">
                    <svg class="fill-current text-white" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18">
                        <path d="M14.53 4.53l-1.06-1.06L9 7.94 4.53 3.47 3.47 4.53 7.94 9l-4.47 4.47 1.06 1.06L9 10.06l4.47 4.47 1.06-1.06L10.06 9z"></path>
                    </svg>
                </div>
            </div>

            <div class="modal-content py-6 text-left px-6">
                <form id="addForm" class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">支會 (Group)</label>
                            <input type="text" id="inputBranch" required placeholder="例如: 蘆竹" class="w-full bg-gray-50 border border-gray-200 p-2.5 rounded-lg focus:ring-2 focus:ring-sage-green focus:border-sage-green outline-none transition">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">姓名 (Name)</label>
                            <input type="text" id="inputName" required placeholder="姓名" class="w-full bg-gray-50 border border-gray-200 p-2.5 rounded-lg focus:ring-2 focus:ring-sage-green focus:border-sage-green outline-none transition">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">車牌號碼 (Plate)</label>
                        <input type="text" id="inputPlate" required placeholder="例如: ABC-1234" class="w-full bg-gray-50 border border-gray-200 p-2.5 rounded-lg font-mono uppercase focus:ring-2 focus:ring-sage-green focus:border-sage-green outline-none transition">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">聯絡電話 (Phone)</label>
                        <input type="tel" id="inputContact" placeholder="09xx-xxx-xxx" class="w-full bg-gray-50 border border-gray-200 p-2.5 rounded-lg focus:ring-2 focus:ring-sage-green focus:border-sage-green outline-none transition">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">外觀備註 (Note)</label>
                        <input type="text" id="inputAppearance" placeholder="例如: 紅色 Toyota" class="w-full bg-gray-50 border border-gray-200 p-2.5 rounded-lg focus:ring-2 focus:ring-sage-green focus:border-sage-green outline-none transition">
                    </div>

                    <div class="flex justify-end pt-4 gap-3">
                        <button type="button" onclick="closeModal()" class="px-5 py-2.5 bg-gray-100 text-gray-600 rounded-lg hover:bg-gray-200 transition font-medium">取消</button>
                        <button type="submit" class="px-5 py-2.5 bg-sage-green text-white rounded-lg hover:bg-sage-dark shadow-md transition font-medium">儲存資料</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 車牌掃描視窗 -->
    <div id="scanModal" class="fixed inset-0 z-[60] bg-black hidden flex-col">
        <div id="scanViewport" class="relative flex-1 overflow-hidden">
            <video id="scanVideo" playsinline muted autoplay class="absolute inset-0 w-full h-full object-cover"></video>
            <div id="scanGuide">
                <p class="absolute left-1/2 -translate-x-1/2 whitespace-nowrap text-white text-sm tracking-wide" style="top: calc(100% + 12px);">請將車牌對準框內，保持穩定</p>
            </div>
            <div class="absolute top-0 inset-x-0 flex items-center justify-between px-4 py-3 bg-gradient-to-b from-black/60 to-transparent text-white">
                <span class="font-bold tracking-widest">掃描車牌</span>
                <button onclick="closeScanner()" title="關閉" class="p-2 rounded-full hover:bg-white/10">
                    <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
        </div>
        <div class="bg-paper-white rounded-t-2xl -mt-4 relative px-5 pt-4 pb-6 max-h-[48%] overflow-y-auto">
            <p id="scanStatus" class="text-sm text-gray-500 text-center">正在開啟相機...</p>
            <p id="scanRaw" onclick="if (this.textContent) useScanText(this.textContent)" title="點一下直接填入搜尋欄" class="text-center font-mono text-lg font-bold text-heritage-blue tracking-widest min-h-[1.75rem] mt-1 cursor-pointer"></p>
            <div id="scanResults" class="space-y-2 mt-2"></div>
            <div id="aiResult" class="hidden mt-3 bg-white border-2 border-sage-green rounded-xl px-4 py-3 shadow-sm"></div>
            <button id="aiScanBtn" onclick="aiScanNow()" class="hidden w-full mt-4 items-center justify-center gap-2 bg-sage-green hover:bg-sage-dark text-white px-4 py-3 rounded-lg shadow-md font-medium tracking-wide">
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.8L20 10l-6.1 1.2L12 17l-1.9-5.8L4 10l6.1-1.2z"/><path d="M19 17l.8 2.2L22 20l-2.2.8L19 23l-.8-2.2L16 20l2.2-.8z"/></svg>
                讀不準？用 AI 辨識
            </button>
            <div class="flex gap-2 mt-3">
                <label class="flex-1 flex items-center justify-center gap-2 bg-white border border-gray-200 text-heritage-blue px-4 py-3 rounded-lg shadow-sm font-medium cursor-pointer">
                    <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                    拍照 / 選相片
                    <input id="scanFile" type="file" accept="image/*" capture="environment" class="hidden">
                </label>
                <button onclick="closeScanner(); document.getElementById('searchInput').focus();" class="flex-1 bg-gray-100 text-gray-600 px-4 py-3 rounded-lg font-medium">手動輸入</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- JavaScript 邏輯 -->
    <script>
        // ============================================
        // 設定區域：請在此填入您的 Google Apps Script 網址
        // ============================================
        const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbxik1YoEgDXkYkbsFWbdZXlm5M_qbHeNAcPXZRW7uouvlOj02o3K7Lmfw-oe6UBpTVJyQ/exec'; 

        // ============================================
        // 內建備用資料庫 (CSV Raw String)
        // ============================================
        const SYSTEM_BACKUP_CSV = `
1,支會,姓名,ABC-1234,N/A,顏色車牌
        `;

        const STORAGE_KEY = 'carPlateSystemData_PRO';
        let carData = [];

        // --- 初始化 & 同步邏輯 ---
        function init() {
            fetchDataFromGAS();
        }

        // 從 GAS 獲取資料
        async function fetchDataFromGAS() {
            showLoading(true);
            const statusEl = document.getElementById('syncStatus');

            if (!GAS_API_URL) {
                console.warn("GAS URL 未設定，切換至本地/備份資料模式");
                loadLocalOrBackup();
                showLoading(false);
                statusEl.textContent = "離線模式";
                statusEl.className = "bg-gray-500 px-3 py-1 rounded-full text-xs font-medium tracking-wide text-white";
                showToast('未設定 GAS 網址，使用備份資料', 'info');
                return;
            }

            try {
                const response = await fetch(GAS_API_URL);
                if (!response.ok) throw new Error('Network response was not ok');
                
                const jsonMatrix = await response.json(); 
                
                if (!Array.isArray(jsonMatrix)) throw new Error('Data format error');

                console.log("GAS 同步成功，開始矩陣迴圈處理...");
                processMatrixData(jsonMatrix);
                
                statusEl.textContent = "雲端已同步";
                statusEl.className = "bg-sage-green px-3 py-1 rounded-full text-xs font-medium tracking-wide text-white";
                showToast('雲端資料同步完成', 'success');

            } catch (error) {
                console.error("GAS Sync Error:", error);
                showToast('雲端同步失敗，切換至離線資料', 'error');
                statusEl.textContent = "同步失敗";
                statusEl.className = "bg-red-500 px-3 py-1 rounded-full text-xs font-medium tracking-wide text-white";
                loadLocalOrBackup();
            } finally {
                showLoading(false);
            }
        }

        function processMatrixData(matrix) {
            const processedData = [];
            
            matrix.forEach((row, index) => {
                if (!Array.isArray(row) || row.length < 4) return;
                const plateVal = (row[3] || "").toString();
                if (plateVal.includes("車牌") || plateVal.includes("Plate")) return;

                const item = {
                    id: Date.now() + index,
                    branch: row[1] || "未分類",
                    name: row[2] || "未知",
                    plate: plateVal.toUpperCase().trim(),
                    contact: row[4] ? row[4].toString() : "N/A",
                    appearance: row[5] || "一般"
                };
                processedData.push(item);
            });

            carData = processedData;
            saveAndRender();
        }

        function loadLocalOrBackup() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                try {
                    carData = JSON.parse(stored);
                    console.log("載入 LocalStorage 快取資料");
                } catch (e) {
                    parseBackupCSV();
                }
            } else {
                parseBackupCSV();
            }
            render();
        }

        function parseBackupCSV() {
            console.log("載入內建備份資料");
            const raw = SYSTEM_BACKUP_CSV.trim();
            const rows = [];
            let currentRow = [];
            let currentCell = '';
            let inQuotes = false;

            for (let i = 0; i < raw.length; i++) {
                const char = raw[i];
                const nextChar = raw[i + 1];

                if (char === '"') {
                    if (inQuotes && nextChar === '"') {
                        currentCell += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === ',' && !inQuotes) {
                    currentRow.push(currentCell.trim());
                    currentCell = '';
                } else if ((char === '\r' || char === '\n') && !inQuotes) {
                    if (currentCell || currentRow.length > 0) {
                        currentRow.push(currentCell.trim());
                        rows.push(currentRow);
                    }
                    currentRow = [];
                    currentCell = '';
                    if (char === '\r' && nextChar === '\n') i++;
                } else {
                    currentCell += char;
                }
            }
            if (currentCell || currentRow.length > 0) {
                currentRow.push(currentCell.trim());
                rows.push(currentRow);
            }

            carData = rows.map((cols, index) => {
                if (cols.length < 4) return null; 
                return {
                    id: Date.now() + index,
                    branch: cols[1] || "未分類",
                    name: cols[2] || "未知",
                    plate: (cols[3] || "無車牌").toUpperCase(),
                    contact: cols[4] || "N/A",
                    appearance: cols[5] || "一般"
                };
            }).filter(item => item !== null);

            saveAndRender();
        }

        // --- 分享連結功能 ---
        function shareLink() {
            const shareUrl = 'https://weichun0203.github.io/stake-parking/';
            
            if (navigator.share) {
                // 如果裝置支援 Web Share API (手機或部分新版瀏覽器)
                navigator.share({
                    title: '桃園支聯會移車查詢',
                    text: '桃園支聯會移車查詢，點擊連結：',
                    url: shareUrl
                }).catch((error) => {
                    console.log('分享取消或失敗', error);
                });
            } else {
                // 網頁版退回使用複製到剪貼簿的功能
                const tempInput = document.createElement('input');
                tempInput.value = shareUrl;
                document.body.appendChild(tempInput);
                tempInput.select();
                try {
                    document.execCommand('copy');
                    showToast('✅ 連結已成功複製到剪貼簿！', 'success');
                } catch (err) {
                    showToast('❌ 複製失敗，請手動複製網址', 'error');
                }
                document.body.removeChild(tempInput);
            }
        }

        // --- 渲染 (Render) 邏輯 ---
        function render() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            const cardContainer = document.getElementById('cardContainer');
            const displayCount = document.getElementById('displayCount');
            const totalCount = document.getElementById('totalCount');
            const emptyMsg = document.getElementById('emptyMsg');

            totalCount.textContent = `總數: ${carData.length}`;

            if (!searchTerm) {
                cardContainer.innerHTML = `
                    <div class="col-span-1 md:col-span-2 lg:col-span-3 text-center py-20 opacity-50">
                        <svg class="mx-auto h-16 w-16 text-gray-300 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                        <p class="text-xl text-gray-400 font-light tracking-widest">請輸入關鍵字開始查詢</p>
                    </div>
                `;
                displayCount.textContent = ''; 
                emptyMsg.classList.add('hidden');
                return;
            }

            // 車牌比對忽略「-」與空白，輸入 ABC1234 也能找到 ABC-1234
            const plateTerm = searchTerm.replace(/[^a-z0-9]/g, '');
            const filtered = carData.filter(item =>
                (item.name || "").toLowerCase().includes(searchTerm) ||
                (item.plate || "").toLowerCase().includes(searchTerm) ||
                (plateTerm.length >= 2 && (item.plate || "").toLowerCase().replace(/[^a-z0-9]/g, '').includes(plateTerm)) ||
                (item.branch || "").includes(searchTerm) ||
                (item.contact || "").includes(searchTerm) ||
                (item.appearance || "").includes(searchTerm)
            );

            displayCount.textContent = `顯示 ${filtered.length} 筆資料`;
            
            if (filtered.length === 0 && carData.length > 0) {
                emptyMsg.classList.remove('hidden');
                cardContainer.innerHTML = '';
            } else {
                emptyMsg.classList.add('hidden');
                
                cardContainer.innerHTML = filtered.map(item => `
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 hover:shadow-lg hover:-translate-y-1 transition-all duration-300 group relative">
                        <div class="flex justify-between items-start mb-4">
                            <div class="flex items-center gap-3">
                                <span class="px-3 py-1 text-xs font-bold rounded-full bg-slate-100 text-heritage-blue tracking-wide">${item.branch}</span>
                            </div>
                        </div>
                        
                        <div class="mb-5 text-center">
                            <h3 class="text-xl font-bold text-gray-800 mb-1 tracking-tight">${item.name}</h3>
                            <div class="inline-block bg-heritage-blue/10 px-4 py-1.5 rounded-lg mt-2">
                                <span class="font-mono font-bold text-2xl text-heritage-blue tracking-widest">${item.plate}</span>
                            </div>
                        </div>

                        <div class="space-y-3 border-t border-gray-100 pt-4">
                            <div class="flex items-start gap-3 text-sm text-gray-600">
                                <span class="text-lg opacity-70">🚙</span>
                                <span class="py-0.5 font-medium">${item.appearance}</span>
                            </div>
                            <div class="flex items-start gap-3 text-sm text-gray-600">
                                <span class="text-lg opacity-70">📞</span>
                                <div class="flex flex-col">
                                    ${formatContact(item.contact)}

        }

        function formatContact(contactStr) {
            if (!contactStr || contactStr === "N/A") return '<span class="text-gray-400 py-0.5">未提供</span>';
            return contactStr.split(/\n|\\n/).map(num => {
                const cleanNum = num.trim().replace(/^'/, ''); 
                return `<a href="tel:${cleanNum}" class="font-medium text-sage-green hover:text-sage-dark hover:underline py-0.5 block">${cleanNum}</a>`;
            }).join('');
        }

        // --- UI 控制 ---
        function showLoading(show) {
            const overlay = document.getElementById('loading-overlay');
            if (show) {
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.style.opacity = '1', 10);
            } else {
                overlay.style.opacity = '0';
                setTimeout(() => overlay.classList.add('hidden'), 500);
            }
        }

        // --- 事件監聽 ---
        document.getElementById('searchInput').addEventListener('input', render);
        
        document.getElementById('addForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            let rawContact = document.getElementById('inputContact').value.trim();
            let processedContact = rawContact ? "'" + rawContact : "N/A";

            const newItem = {
                id: Date.now(),
                branch: document.getElementById('inputBranch').value,
                name: document.getElementById('inputName').value,
                plate: document.getElementById('inputPlate').value.toUpperCase(),

                appearance: document.getElementById('inputAppearance').value || "一般"
            };
            
            carData = [newItem, ...carData];
            saveAndRender();
            closeModal();

            if (GAS_API_URL) {
                fetch(GAS_API_URL, {
                    method: 'POST',
                    mode: 'no-cors',

                        'Content-Type': 'text/plain;charset=utf-8', 
                    },
                    body: JSON.stringify(newItem)
                })
                .then(() => {
                    setTimeout(() => showToast('✅ 雲端同步成功！', 'success'), 1000);
                })
                .catch(error => {
                    console.error('Error:', error);
                    showToast('❌ 雲端同步失敗，請檢查網路', 'error');
                });
            } else {
                 showToast('未設定 GAS 網址，僅儲存於本地', 'info');
            }
        });

        // --- 功能函數 ---
        function saveAndRender() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(carData));
            render();
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bgColor = 'bg-heritage-blue';
            let icon = '';
            if (type === 'success') {
                bgColor = 'bg-sage-green';
            } else if (type === 'error') {
                bgColor = 'bg-red-500';
            }
            
            toast.className = `toast ${bgColor} text-white px-6 py-3 rounded-lg shadow-xl mb-3 flex items-center gap-2 font-medium tracking-wide`;
            toast.innerHTML = `<span>${message}</span>`;
            
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.add('show'));
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        const modal = document.getElementById('modal');
        function openModal() {
            modal.classList.remove('opacity-0', 'pointer-events-none');
            document.body.classList.add('modal-active');
        }
        function closeModal() {
            modal.classList.add('opacity-0', 'pointer-events-none');
            document.body.classList.remove('modal-active');
        }

        // ============================================
        // 車牌辨識（相機 + Tesseract.js OCR，全部在手機端執行）
        // ============================================
        const TESSERACT_SRC = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
        // 台灣車牌不使用 I、O，排除可減少誤判
        const PLATE_WHITELIST = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789';
        // 易混淆字元歸一化：比對時視為相同
        const CONFUSABLE = { O: '0', D: '0', Q: '0', I: '1', L: '1', Z: '2', S: '5', B: '8', G: '6' };

        const DESKEW_ANGLES = [0, -0.07, 0.07, -0.14, 0.14]; // 約 0°、±4°、±8°
        const LIVE_SCAN_INTERVAL = 500; // 即時掃描每次間隔（毫秒），調大可減少畫面跳動
        const scanner = { stream: null, worker: null, workerPromise: null, running: false, timer: null, done: false, frame: 0, misses: 0, lastMatches: [], readings: [], exactHits: {} };

        // AI 辨識（Google Gemini，經由獨立的 Apps Script 轉送；金鑰只存在 GAS 端）
        // 部署 gas/plate-ai.gs 後，把網址貼在這裡；留空則不顯示 AI 辨識按鈕
        const PLATE_AI_URL = 'https://script.google.com/macros/s/AKfycbyxBILlXVYITibkhpThw86Q5guaBgc89fLsy5F69hvw_AzI4DSUH95kcUaeAiS3BEMv2A/exec';

        // 台灣車牌格式（L=英文、D=數字，已去掉「-」）
        const PLATE_TEMPLATES = ['LLLDDDD', 'LLDDDD', 'DDDDLL', 'LLLDDD', 'DDDLLL', 'DDDDLLL'];
        const TO_LETTER = { '0': 'D', '1': 'T', '2': 'Z', '4': 'A', '5': 'S', '6': 'G', '7': 'T', '8': 'B' };
        const TO_DIGIT = { O: '0', D: '0', Q: '0', U: '0', I: '1', L: '1', T: '7', J: '1', Z: '2', S: '5', B: '8', G: '6', A: '4' };

        // 依台灣車牌格式校正：英文位置的數字轉成英文、數字位置的英文轉成數字
        function correctByFormat(text) {
            const s = normalizePlate(text);
            let best = null;
            PLATE_TEMPLATES.forEach(tpl => {
                if (tpl.length !== s.length) return;
                let fixes = 0, out = '';
                for (let i = 0; i < s.length; i++) {
                    const ch = s[i], isDigit = /[0-9]/.test(ch);
                    if (tpl[i] === 'D') {
                        if (isDigit) out += ch;
                        else if (TO_DIGIT[ch]) { out += TO_DIGIT[ch]; fixes++; }
                        else return;
                    } else {
                        if (!isDigit) out += ch;
                        else if (TO_LETTER[ch]) { out += TO_LETTER[ch]; fixes++; }
                        else return;
                    }
                }
                if (!best || fixes < best.fixes) best = { text: out, fixes, tpl };
            });
            if (!best || best.fixes > 2) return s;
            const cut = best.tpl.indexOf(best.tpl[0] === 'L' ? 'D' : 'L');
            return best.text.slice(0, cut) + '-' + best.text.slice(cut);
        }

        // 多幀投票：取最近幾次讀到的結果，逐字取多數
        function voteReadings(readings) {
            if (!readings.length) return '';
            const byLen = {};
            readings.forEach(r => (byLen[r.length] = byLen[r.length] || []).push(r));
            const group = Object.values(byLen).sort((a, b) => b.length - a.length)[0];
            let out = '';
            for (let i = 0; i < group[0].length; i++) {
                const count = {};
                group.forEach(r => count[r[i]] = (count[r[i]] || 0) + 1);
                out += Object.entries(count).sort((a, b) => b[1] - a[1])[0][0];
            }
            return out;
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function setScanStatus(msg, isError = false) {
            const el = document.getElementById('scanStatus');
            el.textContent = msg;
            el.className = `text-sm text-center ${isError ? 'text-red-500' : 'text-gray-500'}`;
        }

        function loadScript(src) {
            return new Promise((resolve, reject) => {
                if (window.Tesseract) return resolve();
                const s = document.createElement('script');
                s.src = src;
                s.onload = resolve;
                s.onerror = () => reject(new Error('無法載入辨識引擎'));
                document.head.appendChild(s);
            });
        }

        function getOcrWorker() {
            if (scanner.worker) return Promise.resolve(scanner.worker);
            if (!scanner.workerPromise) {
                scanner.workerPromise = (async () => {
                    setScanStatus('正在載入辨識引擎（第一次約需數秒）...');
                    await loadScript(TESSERACT_SRC);
                    const worker = await Tesseract.createWorker('eng', 1, {
                        logger: m => {
                            if (m.status === 'loading language traineddata' && m.progress < 1) {
                                setScanStatus(`正在下載辨識資料 ${Math.round(m.progress * 100)}%`);
                            }
                        }
                    });
                    await worker.setParameters({
                        tessedit_char_whitelist: PLATE_WHITELIST,
                        tessedit_pageseg_mode: '7' // 單行文字
                    });
                    scanner.worker = worker;
                    return worker;
                })().catch(err => {
                    scanner.workerPromise = null;
                    throw err;
                });
            }
            return scanner.workerPromise;
        }

        function normalizePlate(s) {
            return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
        }
        function canonicalPlate(s) {
            return normalizePlate(s).replace(/[A-Z]/g, c => CONFUSABLE[c] || c);
        }

        // 模糊子字串距離：pattern 與 text 中任一段落的最小編輯距離
        function fuzzySubstringDistance(pattern, text) {
            const m = pattern.length, n = text.length;
            let prev = new Array(n + 1).fill(0);
            for (let i = 1; i <= m; i++) {
                const cur = [i];
                for (let j = 1; j <= n; j++) {
                    cur[j] = Math.min(
                        prev[j] + 1,
                        cur[j - 1] + 1,
                        prev[j - 1] + (pattern[i - 1] === text[j - 1] ? 0 : 1)
                    );
                }
                prev = cur;
            }
            return Math.min(...prev);
        }

        // 用辨識文字比對資料庫，回傳依分數排序的候選
        function matchPlates(ocrText) {
            const t = canonicalPlate(ocrText);
            if (t.length < 4) return [];
            const seen = new Map();
            carData.forEach(item => {
                const p = canonicalPlate(item.plate);
                if (p.length < 4) return;
                const dist = fuzzySubstringDistance(p, t);
                const maxDist = p.length >= 6 ? 2 : 1;
                if (dist > maxDist) return;
                const score = 1 - dist / p.length;
                const key = normalizePlate(item.plate);
                const prevHit = seen.get(key);
                if (!prevHit || prevHit.score < score) seen.set(key, { plate: item.plate, score, items: [] });
                seen.get(key).items.push(item);
            });
            return [...seen.values()].sort((a, b) => b.score - a.score).slice(0, 4);
        }

        // 從影片擷取「掃描框」範圍並做灰階 + 對比強化
        // angle：每一幀輪流微調角度（弧度），補償手機或車牌歪斜
        function grabGuideFrame(angle = 0) {
            const video = document.getElementById('scanVideo');
            if (!video.videoWidth) return null;
            const vr = video.getBoundingClientRect();
            const gr = document.getElementById('scanGuide').getBoundingClientRect();
            const scale = Math.max(vr.width / video.videoWidth, vr.height / video.videoHeight); // object-cover
            const offX = (vr.width - video.videoWidth * scale) / 2;
            const offY = (vr.height - video.videoHeight * scale) / 2;
            let sx = (gr.left - vr.left - offX) / scale;
            let sy = (gr.top - vr.top - offY) / scale;
            let sw = gr.width / scale, sh = gr.height / scale;
            sx = Math.max(0, sx); sy = Math.max(0, sy);
            sw = Math.min(sw, video.videoWidth - sx); sh = Math.min(sh, video.videoHeight - sy);
            if (sw < 10 || sh < 10) return null;

            const targetH = 180;
            const k = targetH / sh;
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(sw * k);
            canvas.height = targetH;
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            ctx.fillStyle = '#888';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.rotate(angle);
            ctx.drawImage(video, sx, sy, sw, sh, -canvas.width / 2, -canvas.height / 2, canvas.width, canvas.height);
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            enhanceContrast(ctx, canvas.width, canvas.height);
            return canvas;
        }

        function enhanceContrast(ctx, w, h) {
            const img = ctx.getImageData(0, 0, w, h);
            const d = img.data;
            const hist = new Uint32Array(256);
            for (let i = 0; i < d.length; i += 4) {
                const g = (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114) | 0;
                d[i] = g;
                hist[g]++;
            }
            // 取 2% / 98% 百分位做對比拉伸
            const total = w * h;
            let lo = 0, hi = 255, acc = 0;
            for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc >= total * 0.02) { lo = v; break; } }
            acc = 0;
            for (let v = 255; v >= 0; v--) { acc += hist[v]; if (acc >= total * 0.02) { hi = v; break; } }
            const range = Math.max(1, hi - lo);
            for (let i = 0; i < d.length; i += 4) {
                const g = Math.max(0, Math.min(255, ((d[i] - lo) * 255 / range) | 0));
                d[i] = d[i + 1] = d[i + 2] = g;
            }
            ctx.putImageData(img, 0, 0);
        }

        function renderScanResults(rawText, matches) {
            const rawEl = document.getElementById('scanRaw');
            const box = document.getElementById('scanResults');
            const shown = normalizePlate(rawText);
            rawEl.textContent = shown.length >= 4 ? String(rawText).toUpperCase() : '';

            if (shown.length < 4) {
                setScanStatus('對準車牌中...');
                box.innerHTML = '';
                return;
            }
            if (matches.length === 0) {
                setScanStatus('資料庫中暫無相符車牌，請調整角度或距離');
                box.innerHTML = `
                    <button onclick="useScanText('${escapeHtml(shown)}')" class="w-full text-sm text-heritage-blue underline py-1">以「${escapeHtml(shown)}」直接搜尋</button>`;
                return;
            }
            setScanStatus('找到可能的車輛，點選確認：');
            scanner.lastMatches = matches;
            box.innerHTML = matches.map((m, idx) => `
                <button onclick="confirmScanPlate(scanner.lastMatches[${idx}].plate)" class="w-full flex items-center justify-between bg-white border ${m.score === 1 ? 'border-sage-green' : 'border-gray-200'} rounded-lg px-4 py-3 shadow-sm text-left">
                    <span>
                        <span class="font-mono font-bold text-lg text-heritage-blue tracking-widest">${escapeHtml(m.plate)}</span>
                        <span class="block text-sm text-gray-600">${m.items.map(i => escapeHtml(i.name) + '（' + escapeHtml(i.branch) + '）').join('、')}</span>
                    </span>
                    <span class="text-xs ${m.score === 1 ? 'text-sage-green' : 'text-gray-400'} font-medium">${m.score === 1 ? '完全相符' : '相似 ' + Math.round(m.score * 100) + '%'}</span>
                </button>`).join('');
        }

        function mergeMatches(lists) {
            const map = new Map();
            lists.flat().forEach(m => {
                const key = normalizePlate(m.plate);
                if (!map.has(key) || map.get(key).score < m.score) map.set(key, m);
            });
            return [...map.values()].sort((a, b) => b.score - a.score).slice(0, 4);
        }

        // opts.single：單次結果（AI / 相片），不做多幀投票，完全相符就直接帶入
        function handleOcrText(rawText, opts = {}) {
            const norm = normalizePlate(rawText);
            if (norm.length < 4) {
                if (!opts.single) { scanner.readings = []; scanner.exactHits = {}; }
                scanner.lastRenderKey = '';
                renderScanResults('', []);
                return;
            }
            let best = norm;
            if (!opts.single) {
                scanner.readings.push(norm);
                if (scanner.readings.length > 8) scanner.readings.shift();
                best = voteReadings(scanner.readings);
            }
            const display = correctByFormat(best);
            const matches = mergeMatches([matchPlates(norm), matchPlates(best), matchPlates(display)]);
            // 結果沒變就不重畫，避免畫面一直跳
            const renderKey = display + '|' + matches.map(m => m.plate + m.score).join(',');
            if (renderKey !== scanner.lastRenderKey) {
                scanner.lastRenderKey = renderKey;
                renderScanResults(display, matches);
            }

            // 完全相符且只有一台 → 自動帶入（即時掃描需連續 2 次相符，避免誤判）
            const exact = matches.filter(m => m.score === 1);
            if (exact.length === 1 && !scanner.done) {
                const key = normalizePlate(exact[0].plate);
                scanner.exactHits[key] = (scanner.exactHits[key] || 0) + 1;
                if (opts.single || scanner.exactHits[key] >= 2) {
                    scanner.done = true;
                    document.getElementById('scanGuide').classList.add('found');
                    if (navigator.vibrate) navigator.vibrate(120);
                    setTimeout(() => confirmScanPlate(exact[0].plate), 500);
                }
            }
        }

        function confirmScanPlate(plate) {
            closeScanner();
            const input = document.getElementById('searchInput');
            input.value = plate;
            render();
            const first = carData.find(i => normalizePlate(i.plate) === normalizePlate(plate));
            showToast(first ? `🚗 找到車主：${escapeHtml(first.name)}` : '已帶入車牌', 'success');
            document.getElementById('cardContainer').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function useScanText(text) {
            closeScanner();
            document.getElementById('searchInput').value = text;
            render();
        }

        async function scanLoop() {
            if (!scanner.running || scanner.done) return;
            try {
                const worker = await getOcrWorker();
                if (!scanner.running || scanner.done) return;
                const angle = DESKEW_ANGLES[scanner.frame++ % DESKEW_ANGLES.length];
                const canvas = grabGuideFrame(angle);
                if (canvas) {
                    const { data } = await worker.recognize(canvas);
                    if (!scanner.running || scanner.done) return;
                    if (normalizePlate(data.text).length >= 4) {
                        scanner.misses = 0;
                        handleOcrText(data.text);
                    } else if (++scanner.misses >= DESKEW_ANGLES.length * 2) {
                        // 連續多幀都讀不到才清空畫面，避免結果閃爍
                        handleOcrText('');
                    }
                }
            } catch (err) {
                console.error('OCR error:', err);
                setScanStatus('辨識引擎載入失敗，請確認網路連線後重試', true);
                return;
            }
            scanner.timer = setTimeout(scanLoop, LIVE_SCAN_INTERVAL);
        }

        async function openScanner() {
            if (carData.length === 0) {
                showToast('資料尚未載入完成，請稍候', 'info');
            }
            const modalEl = document.getElementById('scanModal');
            modalEl.classList.remove('hidden');
            modalEl.classList.add('flex');
            document.body.style.overflow = 'hidden';
            document.getElementById('scanGuide').classList.remove('found');
            document.getElementById('scanRaw').textContent = '';
            document.getElementById('scanResults').innerHTML = '';
            scanner.done = false;
            scanner.running = true;
            scanner.frame = 0;
            scanner.misses = 0;
            scanner.readings = [];
            scanner.exactHits = {};
            scanner.lastRenderKey = '';
            scanner.aiPlates = [];
            document.getElementById('aiResult').classList.add('hidden');
            const aiBtn = document.getElementById('aiScanBtn');
            aiBtn.classList.toggle('hidden', !PLATE_AI_URL);
            aiBtn.classList.toggle('flex', !!PLATE_AI_URL);

            getOcrWorker().catch(() => {}); // 先在背景載入引擎

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                setScanStatus('此瀏覽器無法直接開啟相機，請改用下方「拍照 / 選相片」', true);
                return;
            }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: false,
                    video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }
                });
                if (!scanner.running) { stream.getTracks().forEach(t => t.stop()); return; }
                scanner.stream = stream;
                const video = document.getElementById('scanVideo');
                video.srcObject = stream;
                await video.play().catch(() => {});
                setScanStatus('對準車牌中...');
                scanLoop();
            } catch (err) {
                console.error('Camera error:', err);
                setScanStatus('無法開啟相機：請允許相機權限，或用 Safari / Chrome 開啟本頁。也可改用下方「拍照 / 選相片」', true);
            }
        }

        function closeScanner() {
            scanner.running = false;
            clearTimeout(scanner.timer);
            if (scanner.stream) {
                scanner.stream.getTracks().forEach(t => t.stop());
                scanner.stream = null;
            }
            document.getElementById('scanVideo').srcObject = null;
            const modalEl = document.getElementById('scanModal');
            modalEl.classList.add('hidden');
            modalEl.classList.remove('flex');
            document.body.style.overflow = '';
        }

        // ---- AI 辨識（Gemini）----
        function frameForAI() {
            // 擷取掃描框外擴一半的彩色畫面，讓 AI 有足夠上下文
            const video = document.getElementById('scanVideo');
            if (!video.videoWidth) return null;
            const vr = video.getBoundingClientRect();
            const gr = document.getElementById('scanGuide').getBoundingClientRect();
            const scale = Math.max(vr.width / video.videoWidth, vr.height / video.videoHeight);
            const offX = (vr.width - video.videoWidth * scale) / 2;
            const offY = (vr.height - video.videoHeight * scale) / 2;
            let sw = gr.width / scale * 1.5, sh = gr.height / scale * 2;
            let sx = (gr.left - vr.left - offX) / scale - gr.width / scale * 0.25;
            let sy = (gr.top - vr.top - offY) / scale - gr.height / scale * 0.5;
            sx = Math.max(0, sx); sy = Math.max(0, sy);
            sw = Math.min(sw, video.videoWidth - sx); sh = Math.min(sh, video.videoHeight - sy);
            const k = Math.min(1, 1024 / sw);
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(sw * k);
            canvas.height = Math.round(sh * k);
            canvas.getContext('2d').drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
            return canvas;
        }

        async function recognizeWithAI(canvas) {
            const base64 = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];
            const res = await fetch(PLATE_AI_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // 避免 CORS 預檢
                body: JSON.stringify({ image: base64 })
            });
            const json = await res.json();
            if (json.error) throw new Error(json.error);
            return (json.plates || []).map(p => String(p).toUpperCase().trim()).filter(p => normalizePlate(p).length >= 4);
        }

        // AI 結果顯示在獨立區塊，不影響即時掃描；按「填入」才帶入搜尋欄
        function showAIBox(html) {
            const box = document.getElementById('aiResult');
            box.innerHTML = html;
            box.classList.remove('hidden');
        }

        function handleAIPlates(plates, emptyMsg) {
            if (!plates.length) {
                scanner.aiPlates = [];
                showAIBox(`<p class="text-sm text-gray-500 text-center">🤖 ${escapeHtml(emptyMsg)}</p>`);
                return;
            }
            // 每個 AI 讀到的號碼對照資料庫；完全相符時用資料庫的寫法
            scanner.aiPlates = plates.slice(0, 3).map(p => {
                const m = matchPlates(p)[0];
                return { text: m && m.score === 1 ? m.plate : p, match: m };
            });
            if (navigator.vibrate) navigator.vibrate(80);
            showAIBox(`
                <p class="text-xs font-bold text-sage-dark tracking-wider mb-2">🤖 AI 辨識結果</p>
                ${scanner.aiPlates.map((a, idx) => {
                    const m = a.match;
                    const info = !m ? '<span class="text-gray-400">資料庫查無此車牌</span>'
                        : (m.score === 1 ? '' : `可能是 ${escapeHtml(m.plate)}（相似 ${Math.round(m.score * 100)}%）：`)
                          + m.items.map(i => escapeHtml(i.name) + '（' + escapeHtml(i.branch) + '）').join('、');
                    return `
                    <div class="flex items-center justify-between gap-3 ${idx ? 'border-t border-gray-100 pt-2 mt-2' : ''}">
                        <div class="min-w-0">
                            <div class="font-mono font-bold text-xl text-heritage-blue tracking-widest">${escapeHtml(a.text)}</div>
                            <div class="text-sm text-gray-600 truncate">${info}</div>
                        </div>
                        <button onclick="fillFromAI(${idx})" class="shrink-0 bg-sage-green hover:bg-sage-dark text-white px-4 py-2 rounded-lg shadow-sm font-medium">填入</button>
                    </div>`;
                }).join('')}`);
        }

        function fillFromAI(idx) {
            const a = scanner.aiPlates[idx];
            if (!a) return;
            // 相似但不完全相符時，以資料庫的車牌為準，方便直接查到車主
            const plate = a.match && a.match.score < 1 ? a.match.plate : a.text;
            closeScanner();
            const input = document.getElementById('searchInput');
            input.value = plate;
            render();
            const owner = carData.find(i => normalizePlate(i.plate) === normalizePlate(plate));
            showToast(owner ? `🚗 找到車主：${escapeHtml(owner.name)}` : `已填入 ${escapeHtml(plate)}，資料庫查無此車牌`, owner ? 'success' : 'info');
            input.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function pauseLiveScan() {
            const wasRunning = scanner.running;
            scanner.running = false;
            clearTimeout(scanner.timer);
            return wasRunning;
        }
        // delay：先讓使用者看清楚訊息，再恢復即時掃描
        function resumeLiveScan(wasRunning, delay = 3000) {
            if (!wasRunning) return;
            clearTimeout(scanner.timer);
            scanner.timer = setTimeout(() => {
                if (scanner.stream && !scanner.done && !scanner.running && !document.getElementById('scanModal').classList.contains('hidden')) {
                    scanner.running = true;
                    scanLoop();
                }
            }, delay);
        }

        // AI 辨識時即時掃描照常進行，兩邊各自顯示
        async function aiScanNow() {
            const btn = document.getElementById('aiScanBtn');
            const canvas = frameForAI();
            if (!canvas) { showAIBox('<p class="text-sm text-red-500 text-center">相機尚未就緒，請稍候或改用「拍照 / 選相片」</p>'); return; }
            btn.disabled = true;
            btn.classList.add('opacity-60');
            showAIBox('<p class="text-sm text-gray-500 text-center">🤖 AI 辨識中...</p>');
            try {
                const plates = await recognizeWithAI(canvas);
                if (document.getElementById('scanModal').classList.contains('hidden')) return; // 已關閉
                handleAIPlates(plates, 'AI 沒看到車牌，請靠近一點再試');
            } catch (err) {
                console.error('AI error:', err);
                showAIBox(`<p class="text-sm text-red-500 text-center">AI 辨識失敗：${escapeHtml(err.message)}</p>`);
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-60');
            }
        }

        // 拍照或從相簿選圖辨識（有設定 AI 時優先用 AI，失敗再用本機引擎）
        document.getElementById('scanFile').addEventListener('change', async (e) => {
            const file = e.target.files && e.target.files[0];
            e.target.value = '';
            if (!file) return;
            const wasRunning = pauseLiveScan();
            let resumeDelay = 3000;
            setScanStatus('正在辨識相片...');
            try {
                const img = await new Promise((resolve, reject) => {
                    const im = new Image();
                    im.onload = () => resolve(im);
                    im.onerror = reject;
                    im.src = URL.createObjectURL(file);
                });
                const maxSide = 1600;
                const k = Math.min(1, maxSide / Math.max(img.width, img.height));
                const canvas = document.createElement('canvas');
                canvas.width = Math.round(img.width * k);
                canvas.height = Math.round(img.height * k);
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                URL.revokeObjectURL(img.src);

                if (PLATE_AI_URL) {
                    try {
                        setScanStatus('對準車牌中...');
                        showAIBox('<p class="text-sm text-gray-500 text-center">🤖 AI 辨識相片中...</p>');
                        handleAIPlates(await recognizeWithAI(canvas), '相片中找不到車牌，請靠近一點、讓車牌清楚入鏡後重拍');
                        resumeDelay = 0; // AI 結果在獨立區塊，即時掃描馬上恢復
                        return;
                    } catch (err) {
                        console.warn('AI 失敗，改用本機辨識', err);
                    }
                }

                const worker = await getOcrWorker();
                enhanceContrast(ctx, canvas.width, canvas.height);
                await worker.setParameters({ tessedit_pageseg_mode: '11' }); // 整張相片：稀疏文字
                const { data } = await worker.recognize(canvas);
                await worker.setParameters({ tessedit_pageseg_mode: '7' });

                // 逐行嘗試，取最佳結果
                const lines = data.text.split(/\n+/).map(normalizePlate).filter(l => l.length >= 4);
                let best = { text: normalizePlate(data.text), matches: matchPlates(data.text) };
                lines.forEach(line => {
                    const m = matchPlates(line);
                    if (m.length && (!best.matches.length || m[0].score > best.matches[0].score)) best = { text: line, matches: m };
                });
                scanner.done = false;
                handleOcrText(best.text, { single: true });
                if (!best.matches.length) setScanStatus('相片中找不到相符車牌，請靠近一點、讓車牌清楚入鏡後重拍');
            } catch (err) {
                console.error('Photo OCR error:', err);
                setScanStatus('相片辨識失敗，請重試', true);
            } finally {
                resumeLiveScan(wasRunning, resumeDelay);
            }
        });

        // 切到背景時關閉相機
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && scanner.stream) closeScanner();
        });

        // 啟動
        init();

    </script>
</body>
</html>
